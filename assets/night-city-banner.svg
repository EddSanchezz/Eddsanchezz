    <circle cx="344" cy="57" r="1.3" opacity=".7"/><circle cx="473" cy="111" r="1" opacity=".55"/>
    <circle cx="592" cy="69" r="1.5" opacity=".6"/><circle cx="726" cy="132" r="1" opacity=".66"/>
    <circle cx="844" cy="64" r="1.2" opacity=".52"/><circle cx="961" cy="102" r="1" opacity=".7"/>
    <circle cx="1076" cy="56" r="1.4" opacity=".55"/><circle cx="1254" cy="71" r="1" opacity=".7"/>
    <circle cx="1436" cy="64" r="1.4" opacity=".58"/><circle cx="1512" cy="145" r="1" opacity=".62"/>
    <circle cx="92" cy="174" r="1" opacity=".45"/><circle cx="395" cy="173" r="1.2" opacity=".42"/>
