<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Night city skyline</title>
  <desc id="desc">A dark navy city skyline with violet haze and cyan and magenta neon lights.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#080b1a"/>
      <stop offset="0.55" stop-color="#11152b"/>
      <stop offset="1" stop-color="#211b3d"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="52%" cy="78%" r="58%">
      <stop offset="0" stop-color="#7445a8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7445a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f4eaff"/>
      <stop offset="1" stop-color="#9d8acb"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4fd0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b45bd5" stop-opacity=".7"/>
      <stop offset="1" stop-color="#6b4fd0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15152c"/>
      <stop offset="1" stop-color="#090d1b"/>
    </linearGradient>
    <pattern id="windows" width="46" height="38" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="4" height="11" rx="1" fill="#72d9f5" opacity=".62"/>
      <rect x="27" y="9" width="4" height="11" rx="1" fill="#c27be9" opacity=".43"/>
      <rect x="9" y="27" width="4" height="5" rx="1" fill="#e9b7ff" opacity=".28"/>
      <rect x="27" y="27" width="4" height="5" rx="1" fill="#72d9f5" opacity=".36"/>
    </pattern>
    <pattern id="smallWindows" width="28" height="32" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="3" height="8" rx="1" fill="#8bdcf2" opacity=".46"/>
      <rect x="18" y="8" width="3" height="8" rx="1" fill="#f18add" opacity=".38"/>
      <rect x="7" y="22" width="3" height="5" rx="1" fill="#f3c5ff" opacity=".25"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="460" fill="url(#sky)"/>
  <rect width="1600" height="460" fill="url(#violetGlow)"/>

  <g fill="#e6ddff">
